<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afinador Pro (430 Hz)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div>
      <h1>Afinador<span>Pro</span></h1>
      <div class="subtitle">Guitarra 6 cuerdas > A4=430Hz</div>
    </div>
    <button id="start-btn">Iniciar</button>
  </header>

  <main>
    <!-- Visualizador de nota grande -->
    <div id="tuner-display">
      <div id="detected-note">--</div>
      <div id="detected-freq">0.0 Hz</div>
    </div>

    <!-- Contenedor Visual Central -->
    <div class="guitar-visual-container">
      
      <!-- Línea y símbolos de afinación -->
      <div class="tuning-line"></div>
      <div id="tuning-indicator"></div>
      <div class="flat-symbol">b</div>
      <div class="sharp-symbol">#</div>

      <!-- El Clavijero -->
      <div class="headstock">
        <div class="nut"></div>
      </div>

      <!-- Marcadores de Nota Flotantes (E, A, D, G, B, E) -->
      <div class="note-markers-container">
        <!-- Lado Izquierdo (Graves) -->
        <div class="note-marker marker-E2" data-note="E2" data-freq="80.54">E</div>
        <div class="note-marker marker-A2" data-note="A2" data-freq="107.50">A</div>
        <div class="note-marker marker-D3" data-note="D3" data-freq="143.49">D</div>
        
        <!-- Lado Derecho (Agudos) -->
        <div class="note-marker marker-G3" data-note="G3" data-freq="191.55">G</div>
        <div class="note-marker marker-B3" data-note="B3" data-freq="240.20">B</div>
        <div class="note-marker marker-E4" data-note="E4" data-freq="322.14">E</div>
      </div>

    </div>

    <!-- Barra de navegación inferior (Solo visual) -->
    <div class="bottom-nav">
      <div class="nav-item">Canciones</div>
      <div class="nav-item">Herramientas</div>
      <div class="nav-item active">Afinar</div>
      <div class="nav-item">Lecciones</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
