<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afinador Pro (430 Hz)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div>
      <h1>Afinador<span>Pro</span></h1>
      <div class="subtitle">A4 = 430Hz</div>
    </div>
    
    <!-- Selector de Afinación -->
    <div class="tuning-selector-container">
      <select id="tuning-select">
        <option value="standard">Estándar (E A D G B E)</option>
        <option value="c_standard">Do / C Standard (C F A# D# G C)</option>
      </select>
    </div>

    <button id="start-btn">Iniciar</button>
  </header>

  <main>
    <!-- Visualizador de nota y frecuencia -->
    <div id="tuner-display">
      <div id="detected-note">--</div>
      <div id="detected-freq">0.0 Hz</div>
      <div id="action-instruction">Toca una cuerda...</div>
    </div>

    <!-- Indicador con Flechas (Tensar / Aflojar) -->
    <div class="tuning-guide">
      <div id="arrow-left" class="arrow">▲<br><span>Tensar</span></div>
      <div class="tuning-line-container">
        <div class="tuning-line"></div>
        <div id="tuning-indicator"></div>
      </div>
      <div id="arrow-right" class="arrow">▼<br><span>Aflojar</span></div>
    </div>

    <!-- Contenedor del Clavijero y Marcadores -->
    <div class="guitar-visual-container">
      
      <!-- Clavijero Ilustrado en Vector (SVG) -->
      <svg class="headstock-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Cuerpo de Madera de la Pala -->
        <path d="M 40 280 L 40 180 Q 20 120 30 50 Q 50 20 100 15 Q 150 20 170 50 Q 180 120 160 280 Z" fill="#4a2c11" stroke="#2d1a0a" stroke-width="3"/>
        <path d="M 45 275 L 45 180 Q 28 123 37 55 Q 55 28 100 23 Q 145 28 163 55 Q 172 123 155 275 Z" fill="#6a3b18"/>
        
        <!-- Cejilla (Nut) y Diapasón -->
        <rect x="40" y="270" width="120" height="12" fill="#e8dcc4" rx="2"/>
        <rect x="45" y="282" width="110" height="18" fill="#22150c"/>

        <!-- Clavijas Metálicas (Izquierda) -->
        <circle cx="25" cy="80" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
        <circle cx="20" cy="140" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
        <circle cx="22" cy="200" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
        
        <!-- Clavijas Metálicas (Derecha) -->
        <circle cx="175" cy="80" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
        <circle cx="180" cy="140" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>
        <circle cx="178" cy="200" r="8" fill="#d0d0d0" stroke="#888" stroke-width="2"/>

        <!-- Cuerdas -->
        <line x1="50" y1="282" x2="35" y2="200" stroke="#aaa" stroke-width="2.5"/>
        <line x1="68" y1="282" x2="32" y2="140" stroke="#aaa" stroke-width="2"/>
        <line x1="86" y1="282" x2="38" y2="80" stroke="#aaa" stroke-width="1.8"/>
        <line x1="114" y1="282" x2="162" y2="80" stroke="#aaa" stroke-width="1.5"/>
        <line x1="132" y1="282" x2="168" y2="140" stroke="#aaa" stroke-width="1.2"/>
        <line x1="150" y1="282" x2="165" y2="200" stroke="#aaa" stroke-width="1"/>
      </svg>

      <!-- Marcadores de Nota Flotantes (Se actualizan por JS) -->
      <div class="note-markers-container">
        <div id="m-6" class="note-marker marker-E2">E</div>
        <div id="m-5" class="note-marker marker-A2">A</div>
        <div id="m-4" class="note-marker marker-D3">D</div>
        
        <div id="m-3" class="note-marker marker-G3">G</div>
        <div id="m-2" class="note-marker marker-B3">B</div>
        <div id="m-1" class="note-marker marker-E4">E</div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
